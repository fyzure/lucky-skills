name: lucky-docker-prune-ci

on:
  push:
    paths:
      - ".github/workflows/lucky-docker-prune-ci.yml"
      - "tools/lucky_docker_prune_ci_probe.py"
      - "tools/lucky_docker_build_ci_probe.py"
      - "tools/lucky_rclone_mount_ci_probe.py"
  pull_request:
    paths:
      - ".github/workflows/lucky-docker-prune-ci.yml"
      - "tools/lucky_docker_prune_ci_probe.py"
      - "tools/lucky_docker_build_ci_probe.py"
      - "tools/lucky_rclone_mount_ci_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-prune-behavior:
    name: Lucky real prune on disposable Docker daemon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker runtime
        run: docker version

      - name: Run isolated real Docker prune probe
        run: sudo -E python3 tools/lucky_docker_prune_ci_probe.py
