name: docs-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q lucky_api tools examples tests

      - name: Verify committed documentation
        run: python tools/verify_repository.py

      - name: Run test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Exercise frontend extractor
        run: |
          python tools/extract_lucky_frontend.py tests/fixtures \
            --version test \
            --output /tmp/lucky-fixture.json \
            --markdown /tmp/lucky-fixture.md \
            --openapi /tmp/lucky-fixture.openapi.json
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('/tmp/lucky-fixture.json').read_text())
          observed = {(item['path'], item['method']) for item in snapshot['routes']}
          expected = {
              ('/api/status', 'GET'),
              ('/api/docker/containers', 'GET'),
              ('/api/docker/containers/{param}/start', 'POST'),
              ('/api/ddns/task/{key}', 'PUT'),
          }
          missing = expected - observed
          if missing:
              raise SystemExit(f'missing expected fixture routes: {sorted(missing)}')
          PY

      - name: Check whitespace errors
        run: git diff --check

  vitepress:
    name: VitePress + Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install VitePress
        run: npm install --include=dev --no-package-lock

      - name: Build Worker assets
        run: npm run docs:worker

      - name: Check output
        run: |
          test -f dist/lucky-skills/index.html
          test -f worker/index.ts
          test -f wrangler.jsonc

      - name: Validate Worker configuration
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy docs
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs:
      - verify
      - vitepress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install VitePress and Wrangler
        run: npm install --include=dev --no-package-lock

      - name: Build and deploy Worker
        run: npm run worker:deploy
