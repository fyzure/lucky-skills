name: lucky-update-ci

on:
  push:
    paths:
      - ".github/workflows/lucky-update-ci.yml"
      - "tools/lucky_update_ci_probe.py"
      - "tools/lucky_docker_build_ci_probe.py"
  pull_request:
    paths:
      - ".github/workflows/lucky-update-ci.yml"
      - "tools/lucky_update_ci_probe.py"
      - "tools/lucky_docker_build_ci_probe.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-behavior:
    name: Lucky disposable self-update behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Docker runtime
        run: docker version

      - name: Apply update on fresh Lucky
        run: sudo -E python3 tools/lucky_update_ci_probe.py
