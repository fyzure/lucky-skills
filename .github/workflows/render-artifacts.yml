name: render-artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Render committed API artifacts
        run: |
          python tools/render_lucky_artifacts.py evidence/lucky-v3-endpoints.json \
            --markdown docs/generated/api-routes.md \
            --openapi openapi/lucky-v3.openapi.json
          git diff --check

      - name: Commit generated artifacts when changed
        run: |
          if git diff --quiet -- docs/generated/api-routes.md openapi/lucky-v3.openapi.json; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/api-routes.md openapi/lucky-v3.openapi.json
          git commit -m "refresh generated Lucky API artifacts"
          git push origin HEAD:main
